spring:
  application:
    name: job-scheduler
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/jobscheduler  
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: job-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3

server:
  port: 8088

app:
  scheduler:
    enabled: true
    poll-ms: 1000
    batch-size: 50
  publisher:
    enabled: true
    poll-ms: 1000
    batch-size: 100
  kafka:
    topic: job-executions
  worker:
    enabled: true
    concurrency: 3
